schedule: '*/5 * * * *'
auth:
  basic_user: '${env.HOMEGATE_BASIC_USER}'
  basic_pass: '${env.HOMEGATE_BASIC_PASS}'
  app_secret: '${env.HOMEGATE_APP_SECRET}'
search:
  location: {lat: 47.3553, lon: 8.5839, radius_m: 2000}
  monthly_rent: {from: 1500, to: 5000}
  number_of_rooms: {from: 3, to: 6}
  living_space: {from: 60}
  categories: [APARTMENT]
  offer_type: RENT
fetch:
  page_size: 50
  max_pages: 2
  pace_ms: 5000
